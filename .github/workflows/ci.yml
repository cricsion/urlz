name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit + integration + doc)
        run: cargo test --all-features
      - name: Docs (deny warnings)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package audit (lib)
        run: cargo package -p urlz --list
      # urlz-cli is NOT packaged here: its versioned dependency on `urlz`
      # resolves against crates.io, which 404s until the lib is first
      # published. Run `cargo package -p urlz-cli` manually after publishing
      # urlz (see CHANGELOG / release checklist).
